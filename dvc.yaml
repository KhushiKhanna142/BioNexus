# DVC pipeline — mirrors the 5-stage MOSAIC architecture.
# Run `dvc repro` to execute only the stages whose inputs actually changed.
stages:
  ingest:
    cmd: python -m mosaic.data.ingestion --config configs/data/default.yaml
    deps:
      - src/mosaic/data/ingestion.py
    outs:
      - data/processed/aligned_omics.parquet

  build_graph:
    cmd: python -m mosaic.graph.construction --config configs/data/default.yaml
    deps:
      - src/mosaic/graph/construction.py
      - data/processed/aligned_omics.parquet
    outs:
      - data/processed/gene_graph.gpickle

  train:
    cmd: python -m mosaic.train --config configs/training/default.yaml
    deps:
      - src/mosaic/train.py
      - data/processed/gene_graph.gpickle
    outs:
      - models/mosaic_latest.pt
    metrics:
      - metrics/eval_metrics.json:
          cache: false

  register_model:
    cmd: python -m mosaic.registry.register_model
    deps:
      - src/mosaic/registry/register_model.py
      - reports/experiment_info.json
