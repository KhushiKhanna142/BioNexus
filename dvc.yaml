# DVC pipeline — mirrors the 5-stage BioNexus architecture.
# Run `dvc repro` to execute only the stages whose inputs actually changed.
stages:
  ingest:
    cmd: python -m bio_nexus.data.ingestion --config configs/data/default.yaml
    deps:
      - src/bio_nexus/data/ingestion.py
    outs:
      - data/processed/aligned_omics.parquet

  build_graph:
    cmd: python -m bio_nexus.graph.construction --config configs/data/default.yaml
    deps:
      - src/bio_nexus/graph/construction.py
      - data/processed/aligned_omics.parquet
    outs:
      - data/processed/gene_graph.gpickle

  train:
    cmd: python -m bio_nexus.train --config configs/training/default.yaml
    deps:
      - src/bio_nexus/train.py
      - data/processed/gene_graph.gpickle
    outs:
      - models/bionexus_latest.pt
    metrics:
      - metrics/eval_metrics.json:
          cache: false

  register_model:
    cmd: python -m bio_nexus.registry.register_model
    deps:
      - src/bio_nexus/registry/register_model.py
      - reports/experiment_info.json
