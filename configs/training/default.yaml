data:
  tcga_project_ids: ["TCGA-BRCA"]
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  held_out_cohort: "METABRIC"
  random_seed: 42

model:
  architecture: "graphgps_cross_attention"
  hidden_dim: 64
  num_layers: 2
  num_heads: 4
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 1e-4
  max_epochs: 100
  early_stopping_patience: 10
  device: "cuda"
  mlflow_experiment_name: "bionexus-cancer-subtype"
