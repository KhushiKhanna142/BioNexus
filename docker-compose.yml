# Local dev stack: training container + self-hosted MLflow tracking server.
# Run: docker compose up
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0

  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    command: python -m bio_nexus.train --config configs/training/smoke_test.yaml
