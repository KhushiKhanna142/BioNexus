# Local dev stack: training container + self-hosted MLflow tracking server.
# Run: docker compose up
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlruns/mlflow.db
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
      --serve-artifacts
      --host 0.0.0.0

  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    command: python -m bio_nexus.train --config configs/training/smoke_test.yaml

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    depends_on:
      - mlflow
    ports:
      - "5000:8000"
    volumes:
      - ./data/serving:/app/data/serving:ro
      - ./mlruns:/mlruns:ro
    environment:
      - BIONEXUS_SERVING_DIR=/app/data/serving
      - BIONEXUS_ALLOW_MOCK=false
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BIONEXUS_MODEL_URI=models:/mosaic-subtype-classifier/Production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://api:8000
