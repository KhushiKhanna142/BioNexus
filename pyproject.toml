[project]
name = "mosaic"
version = "0.1.0"
description = "Multi-Omics Graph Transformer for Cancer Subtype Classification"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "mlflow>=2.14.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.7.0",
    "xgboost>=2.0.0",
    "captum>=0.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "boto3>=1.34.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "nbstripout>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false  # tighten to true once ML stubs are implemented

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/mosaic --cov-report=term-missing"
