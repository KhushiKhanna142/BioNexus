# Kubernetes Deployment for the MOSAIC inference API.
# Apply with: kubectl apply -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-inference
  labels:
    app: mosaic-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mosaic-inference
  template:
    metadata:
      labels:
        app: mosaic-inference
    spec:
      containers:
        - name: mosaic-inference
          image: ghcr.io/OWNER/mosaic:latest   # replace OWNER after first push
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mosaic-secrets
                  key: MLFLOW_TRACKING_URI
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
